name: Apply Web Subscription 5000

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-web-subscription-5000.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch
        run: python scripts/patch_web_subscription_5000.py

      - name: Validate
        run: |
          python - <<'PY'
          text = open('App.js', encoding='utf-8').read()
          assert 'price: "₹5,000"' in text
          assert 'period: "/30 days"' in text
          assert 'subscription/paytm/create-link' in text
          assert 'Quarterly Pro' not in text
          assert 'Annual Pro' not in text
          assert 'Razorpay' not in text
          print('web subscription validation OK')
          PY

      - name: Commit applied patch
        run: |
          rm -f scripts/patch_web_subscription_5000.py
          rm -f .github/workflows/apply-web-subscription-5000.yml
          git config user.name "okai-web-subscription-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Set web subscription to ₹5000 monthly and current payment flow"
          git push origin HEAD:main

# retry-v2
