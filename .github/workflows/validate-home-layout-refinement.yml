name: Validate Home Layout Refinement

on:
  pull_request:
    paths:
      - "index.js"
      - "src/runtime/HomeAccordionEnhancement.js"
      - "src/runtime/HomeLayoutRefinementEnhancement.js"
      - ".github/workflows/validate-home-layout-refinement.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check src/runtime/HomeAccordionEnhancement.js
          node --check src/runtime/HomeLayoutRefinementEnhancement.js
      - name: Verify requested layout rules
        run: |
          grep -q 'HOME_LAYOUT_DIRECT_V2' src/runtime/HomeAccordionEnhancement.js
          grep -q 'KEEP_DROPDOWN_MATCHES' src/runtime/HomeAccordionEnhancement.js
          grep -q 'moveBotControlsToTop' src/runtime/HomeAccordionEnhancement.js
          grep -q '"Trading Mode"' src/runtime/HomeAccordionEnhancement.js
          grep -q '"AUTO Scan Instruments"' src/runtime/HomeAccordionEnhancement.js
          grep -q 'LiveStrategyScoreDropdown' src/runtime/HomeLayoutRefinementEnhancement.js
          grep -q 'actual Trade-tab component' index.js
