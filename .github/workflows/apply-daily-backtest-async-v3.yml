name: Apply Daily Backtest Async V3

on:
  push:
    paths:
      - 'scripts/apply-daily-backtest-async-v3.js'
      - '.github/triggers/daily-backtest-async-v3.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node scripts/apply-daily-backtest-async-v3.js
      - name: Verify async Daily path
        run: |
          grep -q 'OKAI-DAILY-BACKTEST-ASYNC-V3' App.js
          grep -q '/backtest/daily/start' App.js
          grep -q '/backtest/daily/status/' App.js
          if grep -A20 'body.date = date' App.js | grep -q '"/backtest/run"'; then
            echo 'Synchronous daily path still present in active Daily block'
            exit 1
          fi
      - name: Commit App.js
        run: |
          if git diff --quiet -- App.js; then
            echo 'No App.js changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.js
          git commit -m 'Fix Daily Backtest to use background job flow'
          git push
