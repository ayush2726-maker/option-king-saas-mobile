name: EAS Biometric APK Build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-build-biometric-apk.yml"
      - "app.json"
      - "package.json"
      - "AppNavigationPatched.js"
      - "src/runtime/BiometricSessionGate.js"
  workflow_dispatch:

concurrency:
  group: eas-biometric-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build preview APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate biometric login code
        run: node --check src/runtime/BiometricSessionGate.js

      - name: Start Android preview APK build
        run: eas build --platform android --profile preview --non-interactive --no-wait
