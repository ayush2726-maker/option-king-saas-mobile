name: Apply Paper Capital Display V1

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/paper-capital-display-v1.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch paper capital dashboard value
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App.js')
          s = p.read_text()
          old = '  const currentCapital = hasServerCurrentCapital\n    ? Number(ledgerCurrentCapital)\n    : mode === "paper"\n    ? fallbackStartingCapital + Number(signal?.total_pnl || 0)\n    : null;'
          new = '  // PAPER dashboard shows the configured paper capital; cumulative P&L is displayed separately.\n  const currentCapital = mode === "paper"\n    ? fallbackStartingCapital\n    : hasServerCurrentCapital\n    ? Number(ledgerCurrentCapital)\n    : null;'
          count = s.count(old)
          if count == 0:
              raise SystemExit('Expected Current Capital formula not found')
          p.write_text(s.replace(old, new))
          print(f'Patched {count} Current Capital formula block(s)')
          PY
          grep -q 'const currentCapital = mode === "paper"' App.js
          git diff --check

      - name: Validate flexible capital path
        run: node scripts/test-paper-capital-flexible.js

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- App.js; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          git commit -m "Fix paper capital display after save"
          git push origin HEAD:main
