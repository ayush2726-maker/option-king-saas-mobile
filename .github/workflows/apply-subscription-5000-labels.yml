name: Apply Subscription 5000 Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-subscription-5000-labels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_subscription_5000_labels.py
      - run: |
          grep -R "₹5,000" App.js src/runtime/PaytmPaymentEnhancement.js
          rm -f scripts/apply_subscription_5000_labels.py
          rm -f .github/workflows/apply-subscription-5000-labels.yml
          git config user.name "okai-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update subscription labels to ₹5000"
          git push origin HEAD:main
