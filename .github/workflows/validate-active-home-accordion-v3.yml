name: Validate Active Home Layout V4

on:
  pull_request:
    paths:
      - "index.js"
      - "src/runtime/HomeLayoutEnhancement.js"
      - "src/runtime/HomeAccordionEnhancementV3.js"
      - ".github/workflows/validate-active-home-accordion-v3.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check src/runtime/HomeLayoutEnhancement.js
          node --check src/runtime/HomeAccordionEnhancementV3.js
      - name: Verify requested layout rules
        run: |
          grep -q 'return \[...controls, ...rest\]' src/runtime/HomeLayoutEnhancement.js
          grep -q 'node.props?.label' src/runtime/HomeLayoutEnhancement.js
          grep -q 'LiveScoreAccordionPanel' src/runtime/HomeAccordionEnhancementV3.js
          grep -q 'looksLikeLiveScoreCard' src/runtime/HomeAccordionEnhancementV3.js
          grep -q 'Tap to view live strategy score' src/runtime/HomeAccordionEnhancementV3.js
          grep -q 'Only these two Home cards remain collapsible' src/runtime/HomeAccordionEnhancementV3.js
          grep -q 'Trading Mode' src/runtime/HomeAccordionEnhancementV3.js
          grep -q 'AUTO Scan Instruments' src/runtime/HomeAccordionEnhancementV3.js
          ! grep -q 'installHomeLayoutRefinementEnhancement' index.js
