name: Add Web APK Download V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-web-apk-download-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        run: npm install --global eas-cli@latest --no-audit --no-fund

      - name: Find latest downloadable Android APK
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || (echo "Missing EXPO_TOKEN" && exit 1)
          eas build:list --platform android --status finished --limit 20 --json --non-interactive > /tmp/builds.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/builds.json').read_text() or '[]')
          if isinstance(data, dict):
              data=data.get('builds') or data.get('data') or []
          apk=''
          for b in data:
              art=(b or {}).get('artifacts') or {}
              url=art.get('buildUrl') or art.get('applicationArchiveUrl') or ''
              profile=str((b or {}).get('buildProfile') or '').lower()
              if url and (profile=='preview' or url.lower().endswith('.apk') or 'artifacts' in url.lower()):
                  apk=url
                  break
          Path('/tmp/apk_url.txt').write_text(apk)
          print('APK URL found:', bool(apk))
          PY

      - name: Build APK only if none exists
        shell: bash
        run: |
          if [ -s /tmp/apk_url.txt ]; then
            echo "Using existing APK"
            exit 0
          fi
          npm install --no-audit --no-fund
          eas build --platform android --profile preview --non-interactive --wait --json > /tmp/newbuild.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path('/tmp/newbuild.json').read_text() or '[]')
          if isinstance(raw, list):
              b=raw[0] if raw else {}
          else:
              b=raw
          art=(b or {}).get('artifacts') or {}
          url=art.get('buildUrl') or art.get('applicationArchiveUrl') or ''
          if not url:
              raise SystemExit('APK build finished but no downloadable URL was returned')
          Path('/tmp/apk_url.txt').write_text(url)
          print('New APK URL ready')
          PY

      - name: Patch web menu with Download APK
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          apk=Path('/tmp/apk_url.txt').read_text().strip()
          if not apk:
              raise SystemExit('No APK URL available')

          p=Path('src/web/WebDesktopShell.js')
          s=p.read_text()

          marker="const GREEN = '#00d4a0';\n"
          const_line=f"const APK_DOWNLOAD_URL = {json.dumps(apk)};\n"
          if 'const APK_DOWNLOAD_URL =' in s:
              import re
              s=re.sub(r"const APK_DOWNLOAD_URL = .*?;\n", const_line, s, count=1)
          else:
              if marker not in s:
                  raise SystemExit('color anchor missing')
              s=s.replace(marker, marker+const_line, 1)

          nav_anchor="""function directNavigate(route) {
  try {
    if (typeof globalThis !== 'undefined' && typeof globalThis.__OKAI_WEB_NAVIGATE__ === 'function') {
      return globalThis.__OKAI_WEB_NAVIGATE__(route);
    }
  } catch (_) {}
  return false;
}
"""
          helper=nav_anchor+"""
function downloadAndroidApk() {
  try {
    if (typeof globalThis !== 'undefined' && globalThis.location) {
      globalThis.location.href = APK_DOWNLOAD_URL;
      return true;
    }
  } catch (_) {}
  return false;
}
"""
          if 'function downloadAndroidApk()' not in s:
              if nav_anchor not in s:
                  raise SystemExit('directNavigate anchor missing')
              s=s.replace(nav_anchor, helper, 1)

          items_anchor="""    ...items.map(([key, icon, label, route]) =>
      React.createElement(RailItem, {
        key, navKey: key, icon, label, compact,
        active: activeKey === key,
        onPress: () => go(key, route),
      })
    ),
    React.createElement(
      View,
"""
          items_new="""    ...items.map(([key, icon, label, route]) =>
      React.createElement(RailItem, {
        key, navKey: key, icon, label, compact,
        active: activeKey === key,
        onPress: () => go(key, route),
      })
    ),
    React.createElement(RailItem, {
      key: 'download-apk', navKey: 'download-apk', icon: '⇩', label: 'Download APK', compact,
      active: false,
      onPress: () => { onClose && onClose(); downloadAndroidApk(); },
    }),
    React.createElement(
      View,
"""
          if "navKey: 'download-apk'" not in s:
              if items_anchor not in s:
                  raise SystemExit('nav list anchor missing')
              s=s.replace(items_anchor, items_new, 1)

          p.write_text(s)
          Path('.latest-apk.json').write_text(json.dumps({
              'platform':'android',
              'type':'apk',
              'download_url':apk,
              'source':'EAS latest finished build'
          }, indent=2)+'\n')
          PY

          node --check src/web/WebDesktopShell.js
          git diff --check

      - name: Commit download option
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web/WebDesktopShell.js .latest-apk.json
          git commit -m "Add direct APK download to web menu"
          git push origin main
