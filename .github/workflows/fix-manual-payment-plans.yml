name: Fix Manual Payment Plans

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix_manual_payment_plans.py
      - .github/workflows/fix-manual-payment-plans.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.js payment flow
        run: python scripts/fix_manual_payment_plans.py
      - name: Commit patch
        run: |
          if git diff --quiet -- App.js; then
            echo "No App.js changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          git commit -m "Fix app payment button to open fixed Paytm QR"
          git push
