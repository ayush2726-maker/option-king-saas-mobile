name: Apply Block Performance Card V1

on:
  push:
    paths:
      - '.github/triggers/block-performance-card-v1.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_block_performance_card_v1.py
      - name: Commit patched UI
        run: |
          if git diff --quiet; then
            echo "No UI changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/AdvancedAiTabScreen.js
          git commit -m "Show per-block performance in missed trade AI"
          git push
