name: Apply Subscription Admin Controls

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-subscription-admin-controls.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python scripts/patch_subscription_admin_controls.py
      - name: Validate
        run: |
          grep -q 'Deactivate Subscription' src/components/AccountAdminDashboardCard.js
          grep -q '/subscription/razorpay/create-link' App.js
          grep -q 'Pay ₹5,000 via UPI / QR' App.js
      - name: Commit patch
        run: |
          rm -f scripts/patch_subscription_admin_controls.py
          rm -f .github/workflows/apply-subscription-admin-controls.yml
          git config user.name "okai-web-billing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add admin deactivate and verified UPI QR billing"
          git push origin HEAD:main
