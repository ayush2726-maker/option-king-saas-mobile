name: Apply Backtest Stability V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/backtest-stability-v1.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/patch_backtest_stability_v1.py
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          if git diff --cached --quiet; then
            echo "No App.js changes"
            exit 0
          fi
          git commit -m "Fix backtest app reload and large result stability"
          git push
