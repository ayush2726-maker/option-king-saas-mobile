name: Apply Disable In-App OTA V3

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_disable_in_app_ota_checker_v2.py"
      - ".github/workflows/apply-disable-in-app-ota-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-disable-in-app-ota-v3
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore DashboardScreen and disable runtime OTA safely
        run: |
          git show d607c1307c2d7fd08ad8c62c952e2fb2e371719c:App.js > /tmp/good-app.js
          python3 - <<'PY'
          from pathlib import Path
          current = Path('App.js').read_text(encoding='utf-8')
          good = Path('/tmp/good-app.js').read_text(encoding='utf-8')
          dash_marker = '// ── Dashboard Screen ──────────────────────────────────────'
          main_marker = '// ── Main App ──────────────────────────────────────────────'
          if 'function DashboardScreen(' not in current:
              ds = good.index(dash_marker)
              me = good.index(main_marker, ds)
              dashboard_block = good[ds:me]
              mi = current.index(main_marker)
              current = current[:mi] + dashboard_block + current[mi:]
              Path('App.js').write_text(current, encoding='utf-8')
          PY
          python3 scripts/patch_disable_in_app_ota_checker_v2.py
          grep -q "OKAI-INAPP-OTA-DISABLED-V3" App.js
          grep -q "function DashboardScreen(" App.js
          grep -q "function InnerApp()" App.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('App.js').read_text(encoding='utf-8')
          start = text.index('function OtaStatusBanner() {')
          end = text.index('// ── Dashboard Screen', start)
          block = text[start:end]
          forbidden = ['checkForUpdateAsync', 'fetchUpdateAsync', 'reloadAsync', 'AppState.addEventListener', 'checkOta(']
          bad = [x for x in forbidden if x in block]
          if bad:
              raise SystemExit('OTA calls still present in banner: ' + ', '.join(bad))
          PY
          git diff --check

      - name: Persist repaired App.js
        run: |
          if git diff --quiet -- App.js; then
            echo "App.js already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          git commit -m "restore DashboardScreen and safely disable in-app OTA"
          git push origin HEAD:main
