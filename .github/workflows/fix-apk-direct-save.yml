name: Fix APK Direct Save

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-apk-direct-save.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch APK download to stay on app page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/web/WebDesktopShell.js')
          s = p.read_text()
          replacement = '''function openApkDownload() {
  try {
    if (typeof globalThis !== 'undefined' && globalThis.document) {
      const old = globalThis.document.getElementById('okai-apk-download-frame');
      if (old) old.remove();
      const frame = globalThis.document.createElement('iframe');
      frame.id = 'okai-apk-download-frame';
      frame.style.display = 'none';
      frame.src = APK_DOWNLOAD_URL + '?download=1&t=' + Date.now();
      globalThis.document.body.appendChild(frame);
      setTimeout(() => { try { frame.remove(); } catch (_) {} }, 120000);
      return true;
    }
    if (typeof globalThis !== 'undefined' && globalThis.location) {
      globalThis.location.href = APK_DOWNLOAD_URL + '?download=1';
      return true;
    }
  } catch (_) {}
  return false;
}'''
          ns, n = re.subn(r'function openApkDownload\(\) \{.*?\n\}\n\nasync function directLogout', replacement + '\n\nasync function directLogout', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('openApkDownload block not found')
          p.write_text(ns)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/WebDesktopShell.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep APK download in page for Android saving'
          git pull --rebase origin main
          git push origin main
