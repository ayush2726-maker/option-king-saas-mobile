name: Publish Production OTA

on:
  push:
    branches: [main]
    paths:
      - "App.js"
      - "AppPatched.js"
      - "AppNavigationPatched.js"
      - "AppPaymentsPatched.js"
      - "index.js"
      - "src/**"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "ota-release.json"
      - ".github/workflows/publish-production-update.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ota
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Expo token
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub Actions secret: EXPO_TOKEN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Android export
        env:
          CI: "1"
        shell: bash
        run: |
          set -o pipefail
          npx expo export --platform android --output-dir /tmp/okai-ota-export 2>&1 | tee /tmp/okai-android-export.log

      - name: Upload Android export diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: okai-android-export-diagnostics
          path: /tmp/okai-android-export.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish production update
        env:
          CI: "1"
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          eas update \
            --channel production \
            --platform android \
            --message "OKAI Android OTA ${SHORT_SHA}: Advanced AI tab" \
            --non-interactive
