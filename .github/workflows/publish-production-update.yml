name: Publish Production OTA

on:
  push:
    branches: [main]
    paths:
      - "App.js"
      - "AppPatched.js"
      - "AppNavigationPatched.js"
      - "AppPaymentsPatched.js"
      - "index.js"
      - "src/**"
      - "app.json"
      - "eas.json"
      - "package.json"
      - ".github/workflows/publish-production-update.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ota
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check Expo token
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || (echo "Missing EXPO_TOKEN" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        run: npm install --global eas-cli@latest --no-audit --no-fund

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate current source
        shell: bash
        run: |
          node --check src/runtime/SubscriptionActivationGate.js
          node --check src/screens/LocalGatewayScreen.js
          npx expo install --check

      - name: Validate Android export
        env:
          CI: "1"
        shell: bash
        run: |
          rm -rf /tmp/okai-ota-export
          npx expo export --platform android --clear --output-dir /tmp/okai-ota-export
          test -f /tmp/okai-ota-export/metadata.json

      - name: Publish Android update
        env:
          CI: "1"
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          eas update --branch production --platform android --clear-cache --message "OKAI production ${SHORT_SHA}: customer friendly UI and subscription access" --non-interactive

      - name: Point production channel
        env:
          CI: "1"
        shell: bash
        run: |
          eas channel:edit production --branch production --non-interactive
          eas channel:resume production --branch production --non-interactive || true

      - name: Keep legacy default channel compatible
        env:
          CI: "1"
        shell: bash
        run: |
          eas channel:create default --non-interactive || true
          eas channel:edit default --branch production --non-interactive
