name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: '1'
      EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
      EAS_LOCAL_BUILD_WORKINGDIR: ${{ github.workspace }}/local-build-working
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript source
        run: |
          node --check src/components/AiDecisionCard.js
          node --check index.js

      - name: Validate committed launcher PNG
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          target = Path('assets/icon.png')
          raw = target.read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n', raw[:8]
          image = Image.open(target)
          image.verify()
          image = Image.open(target)
          assert image.format == 'PNG', image.format
          assert image.size == (1024, 1024), image.size
          print(f'Valid launcher PNG: {target} ({target.stat().st_size} bytes)')
          PY
          file assets/icon.png

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo prebuild and Metro bundle
        run: |
          npx expo config --type public
          rm -rf android
          npx expo prebuild --no-install --platform android
          test -f android/gradlew
          rm -rf android
          rm -rf /tmp/okai-export
          npx expo export --platform android --output-dir /tmp/okai-export --clear
          test -f /tmp/okai-export/metadata.json

      - name: Build signed APK locally
        run: |
          mkdir -p "$EAS_LOCAL_BUILD_WORKINGDIR" "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/Option-King-AI-v6.apk"

      - name: Verify APK output
        run: |
          test -s Option-King-AI-v6.apk
          file Option-King-AI-v6.apk
          sha256sum Option-King-AI-v6.apk | tee Option-King-AI-v6.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Option-King-AI-v6-APK
          path: |
            Option-King-AI-v6.apk
            Option-King-AI-v6.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload local build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Option-King-AI-v6-build-diagnostics
          path: |
            local-build-working
            local-build-artifacts
          if-no-files-found: ignore
          retention-days: 14
