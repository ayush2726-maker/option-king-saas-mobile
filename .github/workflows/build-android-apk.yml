name: Final Option King AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/v6-build.trigger

permissions:
  contents: read

concurrency:
  group: option-king-ai-final-apk
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: '1'
      EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
      EAS_LOCAL_BUILD_WORKINGDIR: ${{ github.workspace }}/local-build-working
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts

    steps:
      - name: Checkout final source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate every JavaScript source file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . \
            -path './node_modules' -prune -o \
            -path './android' -prune -o \
            -path './.git' -prune -o \
            -type f -name '*.js' -print0)
          echo "Checking ${#files[@]} JavaScript files"
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run project regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm run ai:test
          npm run ai:health
          npm run language:test

      - name: Validate Expo dependency compatibility
        shell: bash
        run: |
          set -euo pipefail
          npx expo install --check
          npx expo-doctor

      - name: Validate committed launcher icon
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          target = Path('assets/icon.png')
          raw = target.read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n', raw[:8]
          image = Image.open(target)
          image.verify()
          image = Image.open(target)
          assert image.format == 'PNG', image.format
          assert image.size == (1024, 1024), image.size
          assert image.mode in {'RGB', 'RGBA'}, image.mode
          print(f'Valid launcher icon: {target} ({target.stat().st_size} bytes, {image.mode})')
          PY
          file assets/icon.png

      - name: Validate Expo config, clean prebuild and Android Metro bundle
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public
          rm -rf android /tmp/okai-export
          npx expo prebuild --clean --no-install --platform android
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          rm -rf android
          npx expo export --platform android --output-dir /tmp/okai-export --clear
          test -f /tmp/okai-export/metadata.json
          find /tmp/okai-export -type f | sort | head -50

      - name: Build one signed APK locally without Expo cloud quota
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_WORKINGDIR" "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          npm install --global eas-cli
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/Option-King-AI-v6.apk"

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          test -s Option-King-AI-v6.apk
          file Option-King-AI-v6.apk
          sha256sum Option-King-AI-v6.apk | tee Option-King-AI-v6.sha256

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Option-King-AI-v6-APK
          path: |
            Option-King-AI-v6.apk
            Option-King-AI-v6.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics only when pipeline fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Option-King-AI-v6-final-diagnostics
          path: |
            local-build-working
            local-build-artifacts
          if-no-files-found: ignore
          retention-days: 14
