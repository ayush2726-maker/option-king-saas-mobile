name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app.json
      - eas.json
      - package.json
      - .easignore
      - assets/icon.png
      - assets/option-king-icon-v2.svg
      - src/components/AiDecisionCard.js
      - .github/workflows/build-android-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: '1'
      EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
      EAS_LOCAL_BUILD_WORKINGDIR: ${{ github.workspace }}/local-build-working
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-build-artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate AI decision card syntax
        run: node --check src/components/AiDecisionCard.js

      - name: Generate and validate selected launcher PNG
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python - <<'PY'
          import io
          from pathlib import Path
          import cairosvg
          from PIL import Image

          source = Path('assets/option-king-icon-v2.svg')
          target = Path('assets/icon.png')
          png = cairosvg.svg2png(
              url=str(source),
              output_width=1024,
              output_height=1024,
          )
          image = Image.open(io.BytesIO(png)).convert('RGB')
          image.save(target, format='PNG', optimize=False)

          raw = target.read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n', raw[:8]
          verified = Image.open(target)
          verified.verify()
          assert verified.format == 'PNG', verified.format
          assert verified.size == (1024, 1024), verified.size
          print(f'Valid launcher PNG ready: {target} ({target.stat().st_size} bytes)')
          PY
          file assets/icon.png
          ls -lh assets/icon.png

      - name: Commit validated launcher PNG before EAS packaging
        run: |
          git config user.name "option-king-build-bot"
          git config user.email "actions@github.com"
          git add -f assets/icon.png
          if git diff --cached --quiet; then
            echo "Launcher PNG is already committed"
          else
            git commit -m "Store validated Option King AI launcher PNG [skip ci]"
            git push origin HEAD:main
          fi
          test "$(git show HEAD:assets/icon.png | head -c 8 | od -An -t x1 | tr -d ' \n')" = "89504e470d0a1a0a"

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify committed Expo prebuild and Metro bundle
        run: |
          test -z "$(git status --porcelain assets/icon.png src/components/AiDecisionCard.js)"
          npx expo config --type public
          rm -rf android
          npx expo prebuild --no-install --platform android
          test -f android/gradlew
          rm -rf android
          rm -rf /tmp/okai-export
          npx expo export --platform android --output-dir /tmp/okai-export --clear
          test -f /tmp/okai-export/metadata.json

      - name: Build signed APK locally
        run: |
          mkdir -p "$EAS_LOCAL_BUILD_WORKINGDIR" "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/Option-King-AI-v6.apk"

      - name: Verify APK output
        run: |
          test -s Option-King-AI-v6.apk
          file Option-King-AI-v6.apk
          sha256sum Option-King-AI-v6.apk | tee Option-King-AI-v6.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Option-King-AI-v6-APK
          path: |
            Option-King-AI-v6.apk
            Option-King-AI-v6.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload local build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Option-King-AI-v6-build-diagnostics
          path: |
            local-build-working
            local-build-artifacts
          if-no-files-found: ignore
          retention-days: 14