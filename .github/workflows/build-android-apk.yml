name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app.json
      - eas.json
      - assets/option-king-icon-v2.svg

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate selected launcher icons
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python - <<'PY'
          import io
          from pathlib import Path
          import cairosvg
          from PIL import Image

          source = Path('assets/option-king-icon-v2.svg')
          assets = Path('assets')

          full_png = cairosvg.svg2png(
              url=str(source), output_width=1024, output_height=1024
          )
          Image.open(io.BytesIO(full_png)).convert('RGBA').save(
              assets / 'icon.png', optimize=True
          )

          safe_png = cairosvg.svg2png(
              url=str(source), output_width=720, output_height=720
          )
          safe = Image.open(io.BytesIO(safe_png)).convert('RGBA')
          canvas = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          canvas.alpha_composite(safe, (152, 152))
          canvas.save(assets / 'adaptive-icon.png', optimize=True)
          print('Generated selected Option King AI launcher and adaptive icons')
          PY

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo configuration
        run: npx expo config --type public

      - name: Build signed Android APK
        run: eas build --platform android --profile preview --non-interactive --wait
