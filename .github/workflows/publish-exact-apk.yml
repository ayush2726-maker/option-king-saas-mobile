name: Publish Exact APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-exact-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: npm install playwright@1.55.0 --no-save --no-package-lock && npx playwright install chromium
      - name: Download exact APK
        run: node scripts/publish_exact_apk.js
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view option-king-ai-latest >/dev/null 2>&1 || gh release create option-king-ai-latest --title "Option King AI APK" --notes "Stable direct APK download"
          gh release upload option-king-ai-latest Option-King-AI.apk --clobber
