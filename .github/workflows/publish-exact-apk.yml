name: Publish Exact APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-exact-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser helper
        run: |
          npm install playwright@1.55.0 --no-save --no-package-lock
          npx playwright install chromium

      - name: Download exact APK from firestorage
        run: |
          cat > /tmp/download-apk.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ acceptDownloads: true });
            const page = await context.newPage();
            const share = 'https://firestorage.ai/ja/f/pHAN6dP_usT8';

            page.on('console', msg => console.log('PAGE:', msg.text()));
            page.on('response', async r => {
              const u = r.url();
              if (/download|file|object|share|api/i.test(u)) console.log('RESP', r.status(), u);
            });

            await page.goto(share, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(12000);
            console.log('TITLE', await page.title());
            console.log('BODY', (await page.locator('body').innerText()).slice(0, 12000));

            let saved = false;
            const clickable = [
              page.getByText('Option King AI.apk', { exact: false }),
              page.getByRole('link', { name: /Option King AI\.apk/i }),
              page.getByRole('button', { name: /Option King AI\.apk/i }),
              page.getByRole('button', { name: /download|ダウンロード/i }),
              page.getByRole('link', { name: /download|ダウンロード/i })
            ];

            for (const locator of clickable) {
              const count = await locator.count().catch(() => 0);
              for (let i = 0; i < count && !saved; i++) {
                const el = locator.nth(i);
                if (!(await el.isVisible().catch(() => false))) continue;
                console.log('TRY CLICK', await el.innerText().catch(() => ''));
                try {
                  const dlPromise = page.waitForEvent('download', { timeout: 30000 });
                  await el.click({ timeout: 15000 });
                  const dl = await dlPromise;
                  await dl.saveAs('Option-King-AI.apk');
                  saved = true;
                } catch (e) {
                  console.log('CLICK NO DOWNLOAD', String(e));
                }
              }
              if (saved) break;
            }

            if (!saved) {
              const anchors = await page.locator('a').evaluateAll(as => as.map(a => ({ text: (a.innerText||'').trim(), href: a.href })));
              console.log('ANCHORS', JSON.stringify(anchors, null, 2));
              const a = anchors.find(x => /Option King AI\.apk/i.test(x.text) || /download/i.test(x.href));
              if (a && a.href) {
                console.log('DIRECT CANDIDATE', a.href);
                const resp = await context.request.get(a.href, { timeout: 120000, maxRedirects: 20 });
                console.log('DIRECT STATUS', resp.status(), resp.headers()['content-type'], resp.headers()['content-length']);
                const body = await resp.body();
                if (body.length > 80000000) {
                  fs.writeFileSync('Option-King-AI.apk', body);
                  saved = true;
                }
              }
            }

            await browser.close();
            if (!saved || !fs.existsSync('Option-King-AI.apk')) throw new Error('Could not download APK from firestorage share');
            const size = fs.statSync('Option-King-AI.apk').size;
            console.log('APK SIZE', size);
            if (size < 80000000 || size > 95000000) throw new Error(`Unexpected APK size ${size}`);
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node /tmp/download-apk.js
          ls -lh Option-King-AI.apk
          sha256sum Option-King-AI.apk

      - name: Publish stable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=option-king-ai-latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Option King AI APK" --notes "Stable direct APK download for the Option King AI web app."
          gh release upload "$TAG" Option-King-AI.apk --clobber

      - name: Patch web Download APK button
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/web/WebDesktopShell.js')
          s = p.read_text()
          direct = 'https://github.com/ayush2726-maker/option-king-saas-mobile/releases/download/option-king-ai-latest/Option-King-AI.apk'
          s = re.sub(r"const APK_DOWNLOAD_PAGE = .*?;\n", f"const APK_DOWNLOAD_URL = '{direct}';\n", s, count=1)
          if 'const APK_DOWNLOAD_URL' not in s:
              s = s.replace("const GREEN = '#00d4a0';\n", "const GREEN = '#00d4a0';\nconst APK_DOWNLOAD_URL = '" + direct + "';\n", 1)
          s = re.sub(
              r"function openApkDownload\(\) \{.*?\n\}\n\nasync function directLogout",
              """function openApkDownload() {
  try {
    if (typeof globalThis !== 'undefined' && globalThis.document) {
      const a = globalThis.document.createElement('a');
      a.href = APK_DOWNLOAD_URL;
      a.download = 'Option-King-AI.apk';
      a.rel = 'noopener noreferrer';
      globalThis.document.body.appendChild(a);
      a.click();
      a.remove();
      return true;
    }
    if (typeof globalThis !== 'undefined' && globalThis.location) {
      globalThis.location.href = APK_DOWNLOAD_URL;
      return true;
    }
  } catch (_) {}
  return false;
}

async function directLogout""",
              s,
              count=1,
              flags=re.S,
          )
          p.write_text(s)
          PY
          node --check src/web/WebDesktopShell.js
          git diff --check

      - name: Commit direct-download web patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/WebDesktopShell.js
          git commit -m 'Use direct APK release download on web'
          git pull --rebase origin main
          git push origin main
