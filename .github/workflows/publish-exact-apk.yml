name: Publish Exact APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-exact-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture firestorage download metadata
        run: |
          curl -L --fail --silent --show-error "https://firestorage.ai/ja/f/pHAN6dP_usT8" -o page.html
          {
            echo "=== URLS ==="
            grep -Eo 'https?://[^"<> ]+' page.html | sed 's/&amp;/\&/g' | sort -u | head -300 || true
            echo "=== MATCHES ==="
            grep -Eio '.{0,180}(download|Option King|apk|api/|dWWCm3XNLk3W2NFn|pHAN6dP_usT8).{0,300}' page.html | head -300 || true
          } > firestorage-inspect.txt
          wc -c page.html firestorage-inspect.txt
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestorage-inspect.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture firestorage APK download metadata"
          git push origin main
