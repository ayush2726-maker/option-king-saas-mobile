name: Publish Exact APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-exact-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firestorage download client
        run: |
          curl -L --fail --silent --show-error 'https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js' -o client.js
          {
            echo '=== SIZE ==='
            wc -c client.js
            echo '=== API MATCHES ==='
            grep -Eio '.{0,280}(download|presign|signed|api/|shareId|publicId|fileId|object|fetch\().{0,520}' client.js | head -500 || true
          } > firestorage-inspect.txt
      - name: Commit inspection output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestorage-inspect.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Capture firestorage download client API'
          git push origin main
