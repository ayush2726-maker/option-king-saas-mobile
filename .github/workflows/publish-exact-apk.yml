name: Publish Exact APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-exact-apk.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage share page
        run: |
          curl -L --fail --silent --show-error "https://firestorage.ai/ja/f/pHAN6dP_usT8" -o page.html
          echo "bytes=$(wc -c < page.html)"
          grep -Eo 'https?://[^" ]+' page.html | head -100 || true
          grep -Ei 'download|Option King|apk|api/' page.html | head -100 || true
